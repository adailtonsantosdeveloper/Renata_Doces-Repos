name: pacote-monsterasp

# Gera, sob demanda (botão "Run workflow"), a pasta de publicação do app para enviar à MonsterASP.NET
# por FTP/SFTP ou pelo gerenciador de arquivos do painel. Não usa secrets e não envia nada sozinho.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publicar (Release)
        run: dotnet publish Renata_Doces.csproj --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: renata-doces-monsterasp
          path: publish
          if-no-files-found: error
          retention-days: 7

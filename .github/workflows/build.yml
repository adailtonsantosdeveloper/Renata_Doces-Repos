name: build

# Compila o projeto e valida o Dockerfile a cada push/PR. Não usa nenhum secret
# e não faz deploy (o deploy é descrito em SECRETS-SETUP.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restaurar e compilar
        run: dotnet build Renata_Doces.sln --configuration Release

      - name: Validar a imagem Docker
        run: docker build -t renata-doces:ci .

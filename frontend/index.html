<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renata Doces - Gestão de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🍰 Renata Doces</h1>
            <p>Sistema de Gestão de Vendas e Pedidos</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('clientes', event)">Clientes</button>
            <button class="tab-btn" onclick="switchTab('produtos', event)">Produtos</button>
            <button class="tab-btn" onclick="switchTab('pedidos', event)">Pedidos</button>
        </div>

        <!-- ABA CLIENTES -->
        <div id="clientes" class="tab-content active">
            <h2>Gerenciar Clientes</h2>
            <form id="clienteForm" onsubmit="salvarCliente(event)">
                <input type="hidden" id="clienteId">
                <div>
                    <label>Código / ID (Somente Leitura):</label>
                    <input type="text" id="clienteIdDisplay" readonly placeholder="Gerado automaticamente">
                </div>
                <div>
                    <label>Nome:</label>
                    <input type="text" id="clienteNome" required>
                </div>
                <div>
                    <label>Telefone:</label>
                    <input type="text" id="clienteTelefone">
                </div>
                <div>
                    <label>E-mail:</label>
                    <input type="email" id="clienteEmail">
                </div>
                <div class="full-width">
                    <label>Endereço:</label>
                    <input type="text" id="clienteEndereco">
                </div>

                <input type="hidden" id="clienteId">
                <button type="submit" id="btnSalvarCliente" class="submit-btn">Cadastrar Cliente</button>
                <button type="button" class="cancel-btn" id="btnCancelarCliente" onclick="limparFormularioCliente()" style="display:none; margin-top: 10px; width: 100%;">Cancelar Seleção</button>
            </form>

            <h3>Lista de Clientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaClientes"></tbody>
            </table>
        </div>

        <!-- ABA PRODUTOS -->
        <div id="produtos" class="tab-content">
            <h2>Gerenciar Produtos / Doces</h2>
            <form id="produtoForm" onsubmit="salvarProduto(event)">
                <input type="hidden" id="produtoDatabaseId">
                <div>
                    <label>ID Banco (Somente Leitura):</label>
                    <input type="text" id="produtoIdDisplay" readonly placeholder="Automático">
                </div>
                <div>
                    <label>Código:</label>
                    <input type="text" id="produtoCodigo" required placeholder="Ex: DOC01">
                </div>
                <div>
                    <label>Nome do Doce:</label>
                    <input type="text" id="produtoNome" required>
                </div>
                <div>
                    <label>Sabor:</label>
                    <input type="text" id="produtoSabor">
                </div>
                <div>
                    <label>Recheio:</label>
                    <input type="text" id="produtoRecheio">
                </div>
                <div>
                    <label>Peso:</label>
                    <input type="text" id="produtoPeso">
                </div>
                <div>
                    <label>Preço de Venda (R$):</label>
                    <input type="number" step="0.01" id="produtoPreco" required>
                </div>
                <div class="full-width">
                    <label>Ingredientes:</label>
                    <input type="text" id="produtoIngredientes">
                </div>

                <input type="hidden" id="produtoDatabaseId">
                <button type="submit" id="btnSalvarProduto" class="submit-btn">Cadastrar Produto</button>
                <button type="button" class="cancel-btn" id="btnCancelarProduto" onclick="limparFormularioProduto()" style="display:none; margin-top: 10px; width: 100%;">Cancelar Seleção</button>
            </form>

            <h3>Catálogo de Produtos</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Sabor</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutos"></tbody>
            </table>
        </div>

        <!-- ABA PEDIDOS -->
        <div id="pedidos" class="tab-content">
            <h2>Novo Pedido</h2>
            <form id="pedidoForm" onsubmit="salvarPedido(event)">
                <div class="full-width">
                    <label>Selecione o Cliente:</label>
                    <select id="pedidoClienteSelect" required></select>
                </div>
                <div class="full-width">
                    <label>Selecione o Produto:</label>
                    <select id="pedidoProdutoSelect" required></select>
                </div>
                <div>
                    <label>Quantidade:</label>
                    <input type="number" id="pedidoQuantidade" value="1" min="1" required>
                </div>
                <button type="submit" class="submit-btn">Registrar Venda / Pedido</button>
            </form>

            <h3>Histórico de Pedidos</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Valor Total</th>
                    </tr>
                </thead>
                <tbody id="tabelaPedidos"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
